name: Lean

# Check every definition and proof, the emitter checks in RubyTest, and that
# ruby-sv generates the SystemVerilog, then simulate it with Verilator. The
# runner is pinned so that the Verilator version from apt only changes on purpose.
# `make sim` and `make impl` need Vivado and are run locally.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and test
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: true

      - name: Generate SystemVerilog
        run: |
          lake exe ruby-sv build/sv
          lake exe ruby-sv build/sv_loc --loc X36Y50
          for d in build/sv build/sv_loc; do
            test "$(tail -n +2 "$d/designs.tsv" | wc -l)" -eq 36
          done
          status=0
          lake exe ruby-sv build/bad --loc x36y50 || status=$?
          test "$status" -eq 1

      - name: Upload SystemVerilog
        uses: actions/upload-artifact@v7
        with:
          name: sv
          path: build/sv

  simulate:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download SystemVerilog
        uses: actions/download-artifact@v8
        with:
          name: sv
          path: build/sv

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      # `-o sv`: use the downloaded SystemVerilog rather than regenerating it.
      - name: Simulate with Verilator
        run: make -o sv verilate

      - name: Check that the testbenches catch a broken sorter
        run: sim/selftest.sh build/sv build/selftest
