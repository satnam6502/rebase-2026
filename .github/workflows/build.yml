name: Build

# Check every definition and proof, and generate the SystemVerilog of all 36
# designs in both placements. The runner is pinned so that tool versions change
# only on purpose.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false

      - name: Generate SystemVerilog
        run: |
          lake exe ruby-sv build/sv
          lake exe ruby-sv build/sv_loc --loc X36Y50
          for d in build/sv build/sv_loc; do
            test "$(tail -n +2 "$d/designs.tsv" | wc -l)" -eq 36
          done
          status=0
          lake exe ruby-sv build/bad --loc x36y50 || status=$?
          test "$status" -eq 1
