name: Build

# Check every definition and proof, check that the Kadane diagrams are up to
# date, and generate the SystemVerilog of all 36 designs in both placements.
# The runner is pinned so that tool versions change only on purpose.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false

      - name: Check that the Kadane diagrams are up to date
        run: |
          lake exe kadane_diagrams
          git add --intent-to-add -- bird-meertens/diagrams
          git diff --exit-code -- bird-meertens/diagrams || {
            echo "::error::The Kadane diagrams are stale. Run 'lake exe kadane_diagrams' and commit the result."
            exit 1
          }
          # The README shows every diagram, and every diagram it shows exists.
          for f in bird-meertens/diagrams/*.svg; do
            grep -q "diagrams/$(basename "$f")" bird-meertens/README.md || { echo "not in the README: $f"; exit 1; }
          done
          for f in $(grep -o 'diagrams/[A-Za-z0-9_-]*\.svg' bird-meertens/README.md | sort -u); do
            test -f "bird-meertens/$f" || { echo "missing: bird-meertens/$f"; exit 1; }
          done

      - name: Generate SystemVerilog
        run: |
          lake exe ruby-sv build/sv
          lake exe ruby-sv build/sv_loc --loc X36Y50
          for d in build/sv build/sv_loc; do
            test "$(tail -n +2 "$d/designs.tsv" | wc -l)" -eq 36
          done
          status=0
          lake exe ruby-sv build/bad --loc x36y50 || status=$?
          test "$status" -eq 1
