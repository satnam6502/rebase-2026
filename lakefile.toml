name = "ruby"
version = "0.1.0"
defaultTargets = ["Ruby", "SquareofSumAristotle"]
testDriver = "RubyTest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "Ruby"

[[lean_exe]]
name = "ruby-sv"
root = "Main"

[[lean_lib]]
name = "RubyTest"

[[lean_lib]]
name = "SquareofSumAristotle"
