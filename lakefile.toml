name = "ruby"
version = "0.1.0"
defaultTargets = ["Ruby", "SquareOfSum", "SquareofSumAristotle", "BirdMeertens", "kadane_bench", "kadane_diagrams", "adder_netlist"]
testDriver = "RubyTest"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "Ruby"

[[lean_exe]]
name = "ruby-sv"
root = "Main"

[[lean_lib]]
name = "RubyTest"

[[lean_lib]]
name = "SquareOfSum"

[[lean_lib]]
name = "SquareofSumAristotle"

[[lean_lib]]
name = "BirdMeertens"
srcDir = "bird-meertens"
leanOptions = { autoImplicit = true, maxRecDepth = 1000000 }

[[lean_exe]]
name = "kadane_bench"
root = "KadaneBench"
srcDir = "bird-meertens/bench"

[[lean_exe]]
name = "adder_netlist"
root = "AdderNetlist"
srcDir = "bird-meertens/netlist"

[[lean_exe]]
name = "kadane_diagrams"
root = "KadaneDiagrams"
srcDir = "bird-meertens/diagrams"
