<title id="title">Definition of segs: segs = concat ∘ map tails ∘ inits</title>
<desc id="desc">Definition of segs: segs = concat ∘ map tails ∘ inits. Starting from [3, −4, 2], the line before the step: segs gives [[], [3], [], [3, −4], [−4], [], [3, −4, 2], [−4, 2], [2], []]. The line after: inits gives [[], [3], [3, −4], [3, −4, 2]], then map tails gives [[[]], [[3], []], [[3, −4], [−4], []], [[3, −4, 2], [−4, 2], [2], []]], then concat gives [[], [3], [], [3, −4], [−4], [], [3, −4, 2], [−4, 2], [2], []].</desc>
